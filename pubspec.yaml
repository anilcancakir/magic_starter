name: magic_starter
description: "Ready-made Magic screens for sign-in, profile, teams, notifications, billing and support chat, each one overridable from your app through a view registry."
version: 1.0.0
homepage: https://anilcancakir.com/magic/starter
repository: https://github.com/anilcancakir/magic_starter
issue_tracker: https://github.com/anilcancakir/magic_starter/issues

topics:
  - authentication
  - starter-kit
  - magic-framework
  - admin-panel

# Inherited from `magic`, not chosen here: magic 1.0.0 declares
# `sdk: ">=3.13.0 <4.0.0"` and `flutter: ">=3.47.0"` (the floor `wind_kit`
# 1.12.0 and `material_ui` 1.11.0 need), and a package cannot resolve below its
# own dependency's floor.
environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # 1.0.0 is the first release with every Magic API the routes and views call
  # (`RouteDefinition.stacked`, `SessionScope`, `pathParameterOf`,
  # `MagicRoute.useOverlayPresentation`) and the one that moved the `Pick`
  # facade out to `magic_picker` and the broadcasting layer out to
  # `magic_socket`; this package imports both. A caret on 1.x admits every later
  # minor.
  magic: ^1.0.0
  magic_picker: ^1.0.0
  magic_socket: ^1.0.0
  dowel: ^1.0.0
  # The floor names an API, `Notify.view`: the notification screens, the bell
  # dropdown and the preferences controller live in that package, and this
  # package's routes resolve them through that registry. The routes also pass
  # `contentClassName` and `headerBuilder` and register `Notify.pushState` as a
  # before-logout hook. 1.0.0 renamed the CLI provider to
  # `MagicNotificationsDowelProvider` and moved Wind to `wind_kit`. A floor must
  # name a version pub.dev already has, or the package is unresolvable.
  magic_notifications: ^1.0.0
  # Direct rather than transitive: `wind_kit` reaches this package through
  # `magic`, so without an entry here there is no floor to raise when this
  # package starts calling a new Wind API. `magic_starter_timezone_select.dart`
  # passes `WSelect.onOpen` (1.6.0), the auth forms pass `autofillHints`
  # (1.8.3, with 1.8.4 restoring platform autofill on fields that pass none),
  # and the `MSSelect` focus ring needs `WSelect` to light `focus:` on keyboard
  # focus (1.9.1). 1.12.0 is the release `magic` 1.0.0 itself depends on.
  wind_kit: ^1.12.0
  # `MaterialApp`, `ThemeData` and `Colors`: `wind_kit` builds on `material_ui`,
  # so `lib/` imports it rather than `flutter/material.dart`.
  material_ui: ^1.11.0
  # The billing screen purchases by catalogue product key on both rails
  # (`checkout(productKey:)`, `purchase(productKey, context:)`) and reads
  # `PurchaseContext`, `StoreBillingService.lastChangeTiming`, `introEligible`
  # (the trial copy) and `BillingErrorCode.paymentDeclined` and
  # `paymentRequiresAction` (its exhaustive error copy switch names both);
  # `switchTeam` re-identifies the store rail through `StoreIdentitySync`. 1.0.0
  # renamed the CLI provider to `MagicPaymentsDowelProvider` and moved to
  # `magic` 1.0.0.
  magic_payments: ^1.0.0
  args: ^2.7.0
  path: ^1.9.1
  # The native store review prompt and the "Rate us" store listing link
  # (Android, iOS and macOS; the starter hides both on web).
  in_app_review: ^2.0.12
  # App version and build number for the support conversation's client context.
  package_info_plus: ^10.2.2
  # The web update banner fetches the deployed `version.json` without the Http
  # facade's API base url, and reloads the page. Already in the graph through
  # `magic`; declared here because `lib/` imports it directly.
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.32.0
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/stubs/install/
